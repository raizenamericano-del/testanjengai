<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Photo Studio — NEURAL AI STUDIO</title>
<meta name="description" content="7 editor foto yang jalan di browser: hapus background, enhance, colorize, style transfer, hapus objek, outpaint, face swap. Semua canvas 2D, tidak ada gambar yang dikirim ke server.">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="mask-icon" href="assets/icon.svg" color="#22d3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  /* one shared "workbench" used by every editor card */
  .wb{display:grid;grid-template-columns:290px minmax(0,1fr);gap:14px;align-items:start}
  @media(max-width:900px){.wb{grid-template-columns:1fr}}
  .wb .ctrl{display:flex;flex-direction:column;gap:10px}
  .stage{background:repeating-conic-gradient(color-mix(in srgb,var(--panel2) 80%,#000) 0 25%,transparent 0 50%) 50%/22px 22px;
          border:1px solid var(--line);border-radius:var(--r);min-height:300px;display:grid;place-items:center;position:relative;overflow:hidden}
  .stage canvas{max-width:100%;max-height:64vh;display:block;margin:auto}
  .stage.painting canvas{cursor:none}
  #brushcur{position:fixed;border:1.5px solid var(--cy);border-radius:50%;pointer-events:none;z-index:90;transform:translate(-50%,-50%);box-shadow:0 0 12px color-mix(in srgb,var(--cy) 60%,transparent);display:none}
  .hits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .hit{display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);cursor:pointer;transition:.18s}
  .hit:hover{border-color:color-mix(in srgb,var(--mg) 45%,transparent);transform:translateY(-2px)}
  .hit .g{font-size:1.25rem;line-height:1;width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--mg) 16%,transparent);color:var(--mg)}
  .hit b{display:block;font-size:.93rem}
  .hit p{margin:3px 0 0;font-size:.76rem;color:var(--dim);line-height:1.45}
  .hist{display:flex;gap:6px;overflow:auto;padding-bottom:2px}
  .hist img{height:42px;width:42px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;flex:0 0 auto}
  .hist img.on{border-color:var(--cy)}
</style>
</head>
<body class="app">
<script src="secrets.local.js"></script>
<script src="assets/js/lib/config.js"></script>
<script src="assets/js/lib/ui.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/auth.js"></script>
<script src="assets/js/lib/img.js"></script>
<script src="assets/js/lib/tools.js"></script>
<script src="assets/js/app-photo.js"></script>
<script src="assets/js/lib/pwa.js"></script>
</body>
</html>
