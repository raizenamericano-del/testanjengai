<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Chat — NEURAL AI STUDIO</title>
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="mask-icon" href="assets/icon.svg" color="#22d3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  html,body{height:100%}
  .app{height:100vh}
  .main{position:relative;background:color-mix(in srgb,var(--bg2) 55%,transparent)}
  .panel{border-left:1px solid var(--line);width:280px;padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto;background:color-mix(in srgb,var(--panel) 70%,transparent)}
  @media(max-width:1180px){.panel{position:absolute;right:0;top:0;bottom:0;z-index:40;transform:translateX(102%);transition:.25s;background:var(--panel)}.panel.open{transform:none;box-shadow:-20px 0 60px rgba(0,0,0,.5)}}
  .att{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);font-size:.78rem}
  .att b{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .msg .img-in{border-radius:10px;border:1px solid var(--line);max-height:260px;width:auto;max-width:min(520px,100%);object-fit:contain;margin-top:8px}
  .rec{background:var(--rd)!important;color:#fff!important;border-color:transparent!important;animation:rc 1.2s infinite}
  @keyframes rc{50%{box-shadow:0 0 0 8px rgba(251,113,133,.18)}}
  .bar{display:flex;align-items:center;gap:8px;height:34px}
  details.sum{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg2)}
  details.sum summary{cursor:pointer;font-size:.8rem;color:var(--dim)}
</style>
</head>
<body class="app">
<script src="secrets.local.js"></script>
<script src="assets/js/lib/config.js"></script>
<script src="assets/js/lib/ui.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/auth.js"></script>
<script src="assets/js/lib/img.js"></script>
<script src="assets/js/lib/ai.js"></script>
<script src="assets/js/app-chat.js"></script>
<script src="assets/js/lib/pwa.js"></script>
</body>
</html>
