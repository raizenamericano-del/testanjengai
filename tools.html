<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tools — NEURAL AI STUDIO</title>
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="mask-icon" href="assets/icon.svg" color="#22d3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  #tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  .tool h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:1rem}
  .tool .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);font-size:.85rem}
  .tool .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .qrcanvas{image-rendering:pixelated}
  .swatch{width:100%;height:44px;border-radius:9px;border:1px solid var(--line);cursor:pointer}
  .contrast-demo{padding:10px;border-radius:9px;font-weight:700;text-align:center}
  .json-err{color:var(--rd)}
  .diffline{display:block;font-family:var(--mono);font-size:.78rem;white-space:pre-wrap;padding:0 4px}
  .diffline.add{background:color-mix(in srgb,var(--lm) 14%,transparent);color:var(--lm)}
  .diffline.del{background:color-mix(in srgb,var(--rd) 14%,transparent);color:var(--rd)}
  table.ed td,table.ed th{padding:3px}
  table.ed input{width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:2px 4px}
</style>
</head>
<body class="app">
<script src="secrets.local.js"></script>
<script src="assets/js/lib/config.js"></script>
<script src="assets/js/lib/ui.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/auth.js"></script>
<script src="assets/js/lib/img.js"></script>
<script src="assets/js/lib/tools.js"></script>
<script src="assets/js/lib/ai.js"></script>
<script src="assets/js/app-tools.js"></script>
<script src="assets/js/lib/pwa.js"></script>
</body>
</html>
