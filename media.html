<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Media & Downloader — NEURAL AI STUDIO</title>
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="mask-icon" href="assets/icon.svg" color="#22d3ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="assets/css/app.css">
<style>
  .embed iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#000}
  .thumb{width:100%;max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
  .wave{width:100%;height:64px;background:var(--bg2);border:1px solid var(--line);border-radius:10px}
  #seq{display:grid;grid-template-columns:64px repeat(32,1fr);gap:2px;font-family:var(--mono);font-size:.6rem}
  #seq .cell{aspect-ratio:1;border-radius:3px;background:var(--bg2);border:1px solid var(--line);cursor:pointer}
  #seq .cell.on{background:var(--vi);border-color:var(--cy);box-shadow:0 0 8px rgba(168,85,247,.6)}
  #seq .cell.play{outline:1px solid var(--lm)}
  #seq .lab{display:flex;align-items:center;color:var(--dim);font-size:.66rem}
  .timeline{position:relative;height:44px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .timeline .sel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--cy) 28%,transparent);border-inline:2px solid var(--cy)}
</style>
</head>
<body class="app">
<script src="secrets.local.js"></script>
<script src="assets/js/lib/config.js"></script>
<script src="assets/js/lib/ui.js"></script>
<script src="assets/js/lib/store.js"></script>
<script src="assets/js/lib/auth.js"></script>
<script src="assets/js/lib/img.js"></script>
<script src="assets/js/lib/tools.js"></script>
<script src="assets/js/lib/ai.js"></script>
<script src="assets/js/lib/links.js"></script>
<script src="assets/js/app-media.js"></script>
<script src="assets/js/lib/pwa.js"></script>
</body>
</html>
